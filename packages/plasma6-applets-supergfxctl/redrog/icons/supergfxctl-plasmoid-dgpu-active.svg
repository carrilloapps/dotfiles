<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- RedRog (packages/plasma6-applets-supergfxctl): line glyph in the text
       color, the accent dot when the dedicated GPU is powered -->
  <defs><style id="current-color-scheme" type="text/css">
    .ColorScheme-Text { color:#efeeeb; }
    .ColorScheme-Highlight { color:#ef3340; }
  </style></defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ColorScheme-Text">
    <circle cx="11" cy="11" r="7"/>
  </g>
  <circle cx="11" cy="11" r="4" fill="currentColor" class="ColorScheme-Highlight"/>
</svg>
