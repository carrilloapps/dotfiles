# RedRog — default configuration (bash syntax).
# Don't edit this file for your own preferences: create config/user.conf
# (ignored by git) and override only what you want there. See docs/CUSTOMIZE.md.

# ── Variant ──────────────────────────────────────────────────────────────────
# "dark" (the palette right below) or "light" (the LIGHT_ palette further
# down). Run the installer again after changing it.
THEME_VARIANT="dark"

# ── Palette (hex without "#") ──────────────────────────────────────────────
# Flat neutrals inspired by the Claude desktop app; ROG red accent.
ACCENT="ef3340"       # Pantone Red 032 C — focus, folders, links, text selection
ACCENT_ALT="f8485e"   # Pantone 1785 C — hover / lighter accent
BG="1c1c1c"           # windows, panels and cards
DEEP="1c1c1c"         # terminal background
SURFACE="252524"      # text fields, bubbles, controls
SURFACE_HI="313131"   # 1 px hairline borders, hover
SELECTION="2b2b2a"    # selected list item (subtle gray, not the accent)
FG="efeeeb"           # primary text (warm white)
FG_DIM="888680"       # secondary text (warm gray)
# ASUS keyboard backlight: the accent as the LEDs can show it. RGB keyboard
# LEDs turn reds with some blue pink, so this is a purer red (Pantone 485 C)
# that looks like ACCENT on the keys.
KEYBOARD_COLOR="da291c"

# Arc Dark anchors for lib/recolor.py: Arc's base gray maps exactly to $BG and
# its text color to $FG; the grays in between are interpolated.
ARC_BASE="2f343f"
ARC_FG="d3dae3"

# ── Light palette (THEME_VARIANT="light") ────────────────────────────────────
# The same warm, flat neutrals as the dark palette, turned around, on Pantone
# whites and warm grays, with the same contrast steps between them. The red is
# a shade deeper so text and focus rings keep their contrast on light ground.
LIGHT_ACCENT="d22630"      # Pantone 1795 C — focus, folders, links, selection
LIGHT_ACCENT_ALT="ef3340"  # Pantone Red 032 C — hover / lighter accent
LIGHT_BG="f0eee9"          # Pantone 11-4201 Cloud Dancer — windows, panels, cards
LIGHT_DEEP="f7f6f3"        # Pantone 11-0601 Bright White — terminal background
LIGHT_SURFACE="faf9f6"     # Pantone 11-0602 Snow White — text fields, controls
LIGHT_SURFACE_HI="dcd9d2"  # Pantone Warm Gray 1 C (lightened) — hairlines, hover
LIGHT_SELECTION="e5e2db"   # selected list item (subtle warm gray)
LIGHT_FG="2a2826"          # Pantone Black 7 C (warmed) — primary text
LIGHT_FG_DIM="7a756e"      # Pantone Warm Gray 9 C — secondary text
LIGHT_ICON_THEME="Papirus-Light"
# Arc (light) anchors for lib/recolor.py: its window gray and text color
LIGHT_ARC_BASE="f5f6f7"
LIGHT_ARC_FG="5c616c"

# ── Fonts, icons and cursor ──────────────────────────────────────────────────
FONT_UI="Inter"
FONT_MONO="JetBrainsMono Nerd Font"
FONT_SIZE=10
ICON_THEME="Papirus-Dark"
ICON_FOLDER_COLOR="red"          # papirus-folders -C <color>
CURSOR_THEME="macOS"

# ── Desktop ──────────────────────────────────────────────────────────────────
# Wallpaper for desktop, lock screen, login screen and Limine. Empty = Arc's.
WALLPAPER=""
# The light variant's own wallpaper (empty: the same as WALLPAPER). Switching
# variants changes every wallpaper RedRog set (and the lock and login screens
# with them); wallpapers picked by hand stay.
LIGHT_WALLPAPER=""
# Dock apps (.desktop ids), in order. Downloads and Trash are appended.
DOCK_APPS=(org.kde.dolphin firefox kitty org.kde.systemsettings)
# Sound: your own EasyEffects presets go in config/audio/ (ignored by git).
# To load one on its own whenever a device connects, add "part of the device
# name|preset name" here, e.g. ("usb-Headset_Brand|My headset").
AUDIO_AUTOLOAD=()
# Microphones the same way: presets in config/audio/input/, e.g.
# ("usb-Headset_Brand|My headset mic").
AUDIO_INPUT_AUTOLOAD=()
# Audio spectrum on the desktop: "halo" (a ring in the center of each screen)
# or "bars" (along the bottom edge)
SPECTRUM_STYLE="halo"
# Keyboard layouts ("xkb layout(variant)|label"): the first is the default.
# Latin American Spanish and US English, the programmers' layout
KEYBOARD_LAYOUTS=("latam|es" "us|en")
# Keyboards that switch the layout when they connect (part of their name, as
# in /proc/bus/input/devices), and the layout they switch to; when they go
# away the first layout comes back. Yours go in config/user.conf
KEYBOARD_AUTO_DEVICES=()
KEYBOARD_AUTO_LAYOUT="us"
# Limine boot menu title
LIMINE_BRANDING="RedRog"

# ── Helpers ──────────────────────────────────────────────────────────────────
# Decimal "R,G,B" for KDE .colors and Konsole .colorscheme files
rgb() { printf '%d,%d,%d' "0x${1:0:2}" "0x${1:2:2}" "0x${1:4:2}"; }
