  <g fill="currentColor" class="ColorScheme-Text">
    <rect x="1.5" y="5.5" width="2.2" height="5" rx="1.1"/>
    <rect x="5.2" y="2" width="2.2" height="12" rx="1.1"/>
    <rect x="8.9" y="4" width="2.2" height="8" rx="1.1"/>
    <rect x="12.6" y="6.5" width="2.2" height="3" rx="1.1"/>
  </g>
</svg>
